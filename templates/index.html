<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>App</title>

    <link rel="stylesheet" href="{{ request.url_for('static', path='index.css') }}">
</head>
<body>

    <div class="header">
        <h1>ADULT CENSUS INCOME PREDICTION</h1>
    </div>

    <div class="back-page">
        <a href="/">
            <button class="button">⬅ Back To Home Page</button>
        </a>
    </div>

    <div class="my-form">

        <form action="/predict" method="post">

            <label>Age</label>
            <input type="number" name="age" required>

            <label>Final Weight</label>
            <input type="number" name="Final_Weight" required>

            <label>Education</label>
            <select name="Education" required>
                <option disabled selected>- select -</option>
                <option value="Higher Studies">Higher Studies</option>
                <option value="Bachelors">Bachelors</option>
                <option value="Associate">Associate</option>
                <option value="Prof-School">Prof-School</option>
                <option value="Diploma">Diploma</option>
                <option value="School">School</option>
            </select>

            <label>Capital Gain</label>
            <select name="CapitalGain" required>
                <option disabled selected>- select -</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>

            <label>Capital Loss</label>
            <select name="CapitalLoss" required>
                <option disabled selected>- select -</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>

            <label>Work Class</label>
            <select name="WorkClass" required>
                <option disabled selected>- select -</option>
                <option value="Private">Private</option>
                <option value="Government">Government</option>
                <option value="SelfEmployeed">SelfEmployeed</option>
                <option value="NoIncome">NoIncome</option>
            </select>

            <label>Marital Status</label>
            <select name="MaritalStatus" required>
                <option disabled selected>- select -</option>
                <option value="Married">Married</option>
                <option value="NotMarried">NotMarried</option>
            </select>

            <label>Race</label>
            <select name="race" required>
                <option disabled selected>- select -</option>
                <option value="White">White</option>
                <option value="Brown">Brown</option>
                <option value="Others">Others</option>
            </select>

            <label>Gender</label>
            <select name="gender" required>
                <option disabled selected>- select -</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label>Weekly Hours</label>
            <select name="hours" required>
                <option disabled selected>- select -</option>
                <option value="ideal">Ideal-Time</option>
                <option value="over">Over-Time</option>
                <option value="part">Part-Time</option>
            </select>

            <label>Country</label>
            <select name="country" required>
                <option disabled selected>- select -</option>
                <option value="US">US</option>
                <option value="Non-US">Non-US</option>
            </select>

            <button type="reset">Reset</button>
            <button type="submit">Predict</button>

        </form>
    </div>

    <div class="foot">
        <footer>Copyright © 2026 Manthan Takalkar</footer>
    </div>

</body>
</html>
